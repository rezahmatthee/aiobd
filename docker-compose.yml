version: '3.9'

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0-jammy
    restart: unless-stopped
    user: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: aiobd
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_net
    secrets:
      - mongo_user
      - mongo_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Redis (session / rate-limit store) ────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    user: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    user: node
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/aiobd?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: info
    env_file:
      - ./backend/.env
    secrets:
      - jwt_access_secret
      - jwt_refresh_secret
      - encryption_secret
      - hmac_secret
    networks:
      - backend_net
      - frontend_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Frontend (served via Nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    user: nginx
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - frontend_net
    depends_on:
      - backend
    ports:
      - "80:8080"
      - "443:8443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

secrets:
  mongo_user:
    environment: MONGO_USER
  mongo_password:
    environment: MONGO_PASSWORD
  jwt_access_secret:
    environment: JWT_ACCESS_SECRET
  jwt_refresh_secret:
    environment: JWT_REFRESH_SECRET
  encryption_secret:
    environment: ENCRYPTION_SECRET
  hmac_secret:
    environment: HMAC_SECRET
